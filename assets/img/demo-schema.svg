<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220">
  <rect width="500" height="220" fill="#131a23"/>
  <rect x="20" y="20" width="140" height="60" rx="8" fill="none" stroke="#4fd1c5" stroke-width="2"/>
  <text x="90" y="55" fill="#dbe4ee" font-family="monospace" font-size="14" text-anchor="middle">Client</text>
  <rect x="340" y="20" width="140" height="60" rx="8" fill="none" stroke="#4fd1c5" stroke-width="2"/>
  <text x="410" y="55" fill="#dbe4ee" font-family="monospace" font-size="14" text-anchor="middle">Serveur</text>
  <line x1="160" y1="50" x2="340" y2="50" stroke="#4fd1c5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="40" fill="#8b9bad" font-family="monospace" font-size="12" text-anchor="middle">requête</text>
  <defs>
